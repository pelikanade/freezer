# Freezer server configuration for the container deployment.
#
# The key reference is README.md, "Running the service". Mount this file at
# /etc/freezer/freezer.yaml (see deploy/compose.yaml). Keep it private: it
# names the repositories this service publishes for, and it is ASCII YAML with
# no environment interpolation — the credentials come from the environment file.

# Inside the container: 0.0.0.0 so the published port reaches it.
listen: 0.0.0.0:8080

# Bind-mounted state directory (deploy/compose.yaml mounts the host's
# ~/freezer/state here).
state_dir: /var/lib/freezer

global_build_cap: 2
glob_cap: 200
job_timeout: 30m
retention: 1000

# Required and positive: polling is the only trigger, and it needs no inbound
# route at all. 10m to 1h is the usual range.
poll_interval: 15m

# The container's own address, used only for the commit status target URL.
public_url: https://freezer.example.com

cache:
  # One R2 bucket, flat namespace, reached through the S3 API endpoint. The
  # custom domain that consumers use is a separate, read-only mapping of the
  # same bucket and is never configured here.
  bucket: freezer-cache
  # R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
  endpoint: https://ACCOUNT_ID.r2.cloudflarestorage.com
  # Mounted read-only; Nix opens it when copying, freezer never reads it.
  signing_key: /etc/freezer/signing.key

repositories:
  - name: personal-flake
    url: https://github.com/OWNER/REPOSITORY.git
    github: OWNER/REPOSITORY
